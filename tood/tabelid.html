<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Tabelid</title>
  <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>

<h1>Tabelid</h1>


<h2>1. Lihtne tabel</h2>
<table id="tabel1">
  <tr>
    <td class=" 1">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>


<h2>2. Veel üks tabel, kus on ühendatud lahtrid</h2>
<table id="tabel2">
  <tr>
    <td colspan="2">A ja B (ühendatud)</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>


<h2>3. Kolmas tabel (vasakul 1 tulp, paremal 2)</h2>
<table id="tabel3">
  <tr>
    <td rowspan="2">Vasak tulp (A)</td>
    <td>Parem 1 (B)</td>
  </tr>
  <tr>
    <td>Parem 2 (C)</td>
  </tr>
</table>

</body>
</html>
<h2>4. Iseseisev tabel</h2>
<table id="tabel4">

  <tr>
    <td rowspan="4">A</td>
    <td colspan="3">B</td>
  </tr>

  <tr>
    <td>C</td>
    <td>D</td>
    <td rowspan="3">E</td>
  </tr>

  <tr>
    <td colspan="2">F</td>
  </tr>

  <tr>
    <td colspan="2">G</td>
  </tr>
</table>
<h2>5. Spiraaltabel</h2>
<table id="tabel5">

  <tr>
    <td colspan="8">1</td>
  </tr>

  <tr>
    <td rowspan="6">2</td>
    <td colspan="6">3</td>
    <td rowspan="7">4</td>
  </tr>

  <tr>
    <td rowspan="4">5</td>
    <td colspan="4">6</td>
    <td rowspan="5">7</td>
  </tr>

  <tr>
    <td rowspan="2">8</td>
    <td colspan="2">9</td>
    <td rowspan="3">10</td>
  </tr>

  <tr>
    <td>11</td>
    <td>12</td>
  </tr>

  <tr>
    <td colspan="3">13</td>
  </tr>

  <tr>
    <td colspan="5">14</td>
  </tr>

  <tr>
    <td colspan="7">15</td>
  </tr>
</table>
