<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Programmeerimise küsimustik</title>
    <link rel="stylesheet" href="progiStyle.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="progiScript.js" defer></script>
</head>
<body>

<h1>Programmeerimise küsimustik</h1>
<div>HTML vormid, nupud ja jQuery valideerimine</div>
<br>

<form id="progiVorm" action="#">
    <table>
        <!-- 1. Checkbox -->
        <tr>
            <td>
                <span>Milliseid programmeerimiskeeli sa tead?</span>
            </td>
            <td>
                <input type="checkbox" name="keeled" id="js" value="JavaScript">
                <label for="js">JavaScript</label>
                <br>
                <input type="checkbox" name="keeled" id="py" value="Python">
                <label for="py">Python</label>
                <br>
                <input type="checkbox" name="keeled" id="java" value="Java">
                <label for="java">Java</label>
                <br>
                <input type="checkbox" name="keeled" id="cs" value="C#">
                <label for="cs">C#</label>
                <br>
                <input type="checkbox" name="keeled" id="php" value="PHP">
                <label for="php">PHP</label>
                <div id="vigaKeeled" class="viga" style="color: red; display: none;">Palun vali vähemalt üks keel!</div>
            </td>
            <td>
                <div id="vastusKeeled"></div>
            </td>
        </tr>

        <!-- 2. Textarea: Arvamus -->
        <tr>
            <td>
                <label for="arvamus">Mida arvad programmeerimise õppimisest?</label>
            </td>
            <td>
                <textarea id="arvamus" name="arvamus" rows="3" cols="25"></textarea>
                <div id="vigaArvamus" class="viga" style="color: red; display: none;">See väli on kohustuslik!</div>
            </td>
            <td>
                <div id="vastusArvamus"></div>
            </td>
        </tr>

        <!-- 3. Range: Tunnid -->
        <tr>
            <td>
                <label for="tunnid">Mitu tundi nädalas tegeled programmeerimisega?</label>
            </td>
            <td>
                0 <input type="range" id="tunnid" name="tunnid" min="0" max="40" value="10"> 40
            </td>
            <td>
                <div id="vastusTunnid"></div>
            </td>
        </tr>

        <!-- 4. Radio-->
        <tr>
            <td>
                <span>Kas sulle meeldib programmeerida?</span>
            </td>
            <td>
                <input type="radio" name="meeldib" id="meeldibJah" value="smile.png">
                <label for="meeldibJah">Jah</label>
                <br>
                <input type="radio" name="meeldib" id="meeldibEi" value="kurb.png">
                <label for="meeldibEi">Ei</label>
                <div id="vigaMeeldib" class="viga" style="color: red; display: none;">Palun tee valik!</div>
            </td>
            <td>
                <div id="vastusMeeldib"></div>
                <br>
                <img id="meeldibPilt" src="" alt="Smail" class="peidetud">
            </td>
        </tr>

        <!-- 5. Text: Tööriistad -->
        <tr>
            <td>
                <label for="tooriistad">Milliseid programmeerimisega seotud tööriistu oskad nimetada?</label>
            </td>
            <td>
                <input type="text" id="tooriistad" name="tooriistad" placeholder="VS Code, GitHub">
                <div id="vigaTooriistad" class="viga" style="color: red; display: none;">Palun sisesta tööriistad!</div>
            </td>
            <td>
                <div id="vastusTooriistad"></div>
            </td>
        </tr>

        <!-- 6. Select: Soovitud keel -->
        <tr>
            <td>
                <label for="soovitudKeel">Millist programmeerimiskeelt sooviksid kõige rohkem õppida?</label>
            </td>
            <td>
                <select name="soovitudKeel" id="soovitudKeel">
                    <option value="vali">vali...</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="C#">C#</option>
                    <option value="PHP">PHP</option>
                    <option value="C++">C++</option>
                </select>
                <div id="vigaSoovitudKeel" class="viga" style="color: red; display: none;">Palun vali keel rippmenüüst!</div>
            </td>
            <td>
                <div id="vastusSoovitudKeel"></div>
            </td>
        </tr>

        <!-- Nupud "Puhasta" ja "Saada" -->
        <tr>
            <td>
                <button type="reset" id="puhasta">Puhasta</button>
            </td>
            <td>
                <button type="submit" id="saada">Saada</button>
            </td>
            <td>
                <div id="vastuskoik"></div>
            </td>
        </tr>

    </table>
</form>

</body>
</html>
