<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../JavaScript/piltScript.js"></script>
</head>
<body>

<h1>Juhuslik pilt</h1>
<img src="../images/lill.png" alt="" id="randomPilt">
<br>
<input type="button" onclick="juhuslikPilt()" value="Vaheta Pilt">

<h2>Mõistatus. Arva ära mida näed pildil?</h2>
<section id="myistatus">
<label for="valik">Vali vastus:</label>
<select name="valik" id="valik" onchange="selectValik()">
    <option value="vali...">vali...</option>
    <option value="../images/smile.png">Smile</option>
    <option value="../images/kurb.png">Kurb</option>
    <option value="../images/neutral.png">Neutral</option>
    <option value="../images/lill.png">Lill</option>
</select>
<p id="vastus"></p>
</section>
<section id="valik2">
    <input type="radio" name="pilt Valik" id="v1" value="../images/smile.png" onclick="raadioValik()">
    <label for="v1">Smile pilt:</label>
    <br>
    <input type="radio" name="pilt Valik" id="v2" value="../images/kurb.png" onclick="raadioValik()">
    <label for="v2">Kurb pilt:</label>
    <br>
    <input type="radio" name="pilt Valik" id="v3" value="../images/neutral.png" onclick="raadioValik()">
    <label for="v3">Neutral pilt:</label>
    <input type="radio" name="pilt Valik" id="v4" value="../images/lill.png" onclick="raadioValik()">
    <label for="v4">Lill pilt:</label>
    <br>
    <img src="" alt="" id="valitudPilt">


</section>
</body>
</html>
